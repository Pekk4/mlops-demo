apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "wine"
  namespace: default
  annotations:
    #serving.kserve.io/deploymentMode: RawDeployment
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8082"
    serving.kserve.io/s3-endpoint: minio.minio.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
spec:
  predictor:
    serviceAccountName: kserve-sa
    model:
      modelFormat:
        name: sklearn
      protocolVersion: v2
      storageUri: "s3://mlflow/0/models/m-f1e1541e6fe6454ab697491ec9b28c16/artifacts"
      image: mlops-pipeline-registry:5000/seldonio/mlserver:v1.5.0-local
      imagePullPolicy: IfNotPresent
      #ports:
      #  - containerPort: 8080
      #    protocol: TCP
