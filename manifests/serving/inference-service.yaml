apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "wine"
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8082"
    serving.kserve.io/s3-endpoint: minio.minio.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
spec:
  predictor:
    serviceAccountName: kserve-sa
    containers:
      - name: kserve-container
        image: k3d-pipeline-registry.localhost:5000/seldonio/mlserver:v1.5.0-paikallinen
        imagePullPolicy: IfNotPresent
    model:
      modelFormat:
        name: sklearn
      protocolVersion: v2
      storageUri: "s3://mlflow/0/models/m-ab2cf0545ac64394a97a59bd26b23469/artifacts"
